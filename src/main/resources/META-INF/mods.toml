description='''
Datapack-driven skill trees in the style of Path of Exile: attributes, conditions, commands and recipes per node, choices and limited groups, skill points bought with XP levels. Trees are made with the external HTML editor.
Árboles de habilidades por datapack al estilo Path of Exile: atributos, condiciones, comandos y recetas por nodo, elecciones y grupos limitados, puntos de habilidad comprados con niveles de XP. Los árboles se hacen con el editor HTML externo.
'''

